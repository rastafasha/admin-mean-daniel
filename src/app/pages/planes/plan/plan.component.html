<!-- =======| Main |======= -->
<div class="container animated fadeInUp" id="main" class="main" role="main" name="users">

    <div class="col-xs-12">
        <div class="leftside">
            <!-- Page Title -->
            <app-back-button [title]="title"></app-back-button>
        </div>
        
        <div class="clear"></div>



        <section class="section dashboard">

            <div class="planespage">
                <div class="row">
                    <div class="col-xs-12 col-sm-6">
                        <div class="card text-center mb-3 itemproduct">

                            <div class="db-wrapper">
                                <div class="db-pricing-eleven" [style.background]="plan.color">
                                    <div class="price">
                                        <div *ngIf="plan.price ">
                                            <sup>$</sup>{{plan.price}}
                                        </div>
                                        <div *ngIf="!plan.price ">
                                            <small>Gratis (sólo registrate)</small>
                                        </div>
                                        <small>{{plan.tiempo}}</small>
                                    </div>
                                    <div class="type">
                                        {{plan.name}}
                                    </div>
                                    <div [innerHtml]="plan.adicional | safe: 'html'" class="description"></div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>



        </section>
    </div>


</div>
<!--/main-->
