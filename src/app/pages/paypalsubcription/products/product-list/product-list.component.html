            <!-- Page Title -->
            <app-back-button [title]="title"></app-back-button>
        </div>
        <div class="clear"></div>
        <section class="section dashboard">
            <div class="container">
                <div class="row">
                    <div class="col-xs-11 col-sm-11">
                        <!-- buscador -->

                            <div class="p-1 bg-light rounded rounded-pill shadow-sm mb-4">

                                        placeholder="Buscar.." [(ngModel)]="query" aria-describedby="button-addon1"
                                        class="form-control border-0 bg-light">

                                </div>
                            </div>
                        </form> -->
                        <!-- buscador -->
                    </div>
                    <div class="col-xs-1 col-sm-1">
                        <div class="text-right">
                            <button class="btn btn-primary" [routerLink]="['/dashboard/product/crear/']" >
                                <i class="fa fa-pencil"></i>
                                Crear
                            </button>
                            <!-- <button class="btn btn-primary" (click)="iraCrear()" >
                                <i class="fa fa-pencil"></i>
                                Crear
                            </button> -->
                        </div>
                    </div>
                </div>
                <div class="card recent-sales overflow-auto">
                    <app-loading *ngIf="loading"></app-loading>
                    <div class="card-body" *ngIf="!loading">
                        <pagination-controls (pageChange)="p = $event"></pagination-controls>
                        <table [ngClass]="loading? 'table table-borderless datatable':'table table-borderless'">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>product_id</th>
                                    <th>Creado</th>
                                    <th class="text-nowrap">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr
                                    *ngFor="let product of productsPaypal |  paginate: { itemsPerPage: count, currentPage: p }">

                                    <td>{{product.name}}</td>
                                    <td>{{product.id}}</td>
                                    <td>{{product.create_time | date}} </td>
                                    <td class="text-nowrap text-center">
                                        <button [routerLink]="['/dashboard/product/edit', product.id]" class="btn btn-outline-success"
                                            data-toggle="tooltip" data-original-title="Edit">
                                            <i class="fa fa-edit text-success" ></i>
                                        </button>
                                        &nbsp;
                                        <button (click)="eliminarProduct(product.id)" class="btn btn-outline-danger" data-toggle="tooltip"
                                            data-original-title="Borrar">
                                            <i class="fa fa-trash text-danger"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <pagination-controls (pageChange)="p = $event"></pagination-controls>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>
<!--/main-->
